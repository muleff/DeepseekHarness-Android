name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.6)"
        required: false
        default: "v0.2.6"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Accept Android SDK licenses
        run: |
          SDK_MGR=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDK_MGR" --licenses > /dev/null || true

      - name: Fetch prebuilt native libraries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: jackwener/DeepseekHarness-Android
          JNI_DIR: ${{ github.workspace }}/toolchains/out/jniLibs
        run: |
          chmod +x native/prebuilt.sh js/build-engine.sh tools/fetch-shizuku.sh gradlew
          ./native/prebuilt.sh fetch

      - name: Build DSH engine bundle
        env:
          OUT_DIR: ${{ github.workspace }}/toolchains/out/engine
          WORK_DIR: ${{ github.workspace }}/toolchains/out/engine-build
        run: ./js/build-engine.sh

      - name: Run JavaScript engine test suite
        run: |
          node --test js/test/hardline.test.mjs js/test/mode.test.mjs js/test/prompt.test.mjs js/test/experience.test.mjs js/test/provider-network.test.mjs js/test/provider-protocol.test.mjs
          node js/test/attachment-dir-sync.test.mjs "${{ github.workspace }}/toolchains/out/engine-build/stage/node_modules/@deepseek-ai/dsh-attachment-local/lib/index.js"

      - name: Run Kotlin unit tests and assemble Release APK
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease \
            -Pdsh.nativeOut=${{ github.workspace }}/toolchains/out/jniLibs \
            -Pdsh.engineOut=${{ github.workspace }}/toolchains/out/engine \
            -Pdsh.thirdPartyOut=${{ github.workspace }}/toolchains/out/third-party \
            --no-daemon

      - name: Prepare Release Artifacts
        id: artifacts
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == "main" || -z "$TAG" ]]; then
            TAG="${{ github.event.inputs.tag || 'v0.2.6' }}"
          fi
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_NAME="DSH-Android-${TAG}-arm64.apk"
          cp "$APK_SRC" "$APK_NAME"
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"
          SHA=$(cut -d' ' -f1 "${APK_NAME}.sha256")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.artifacts.outputs.tag }}"
          APK="${{ steps.artifacts.outputs.apk }}"
          SHA="${{ steps.artifacts.outputs.sha }}"
          NOTES=$(cat <<EOF
          ## DSH-Android ${TAG}

          ### Cambios principales
          - **Idioma predeterminado en español**: localización completa en `res/values/` y `res/values-es/`, configuración inicial automática en Android 10+ y soporte multilingüe (`es`, `en`, `zh`).
          - **Servicio de accesibilidad corregido**: detección multicanal en capas OEM (MIUI, HyperOS, OneUI, ColorOS), preservación de capacidades XML en `onServiceConnected`, eliminación de banderas incompatibles en API < 33 y espera activa de enlace Binder en herramientas de pantalla.

          ### Verificación SHA-256
          \`\`\`text
          ${SHA}  ${APK}
          \`\`\`
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "${APK}.sha256" --clobber
            gh release edit "$TAG" --title "DSH-Android ${TAG}" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" "${APK}.sha256" --title "DSH-Android ${TAG}" --notes "$NOTES"
          fi
